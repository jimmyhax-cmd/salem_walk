<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#241436">
<title>SALEM 1998: GBC Walking Tour</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #0d0714;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .gbc-shell {
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    max-height: 890px;
    background: linear-gradient(145deg, #3b2354 0%, #1e102e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 18px 14px;
    border-radius: 16px 16px 40px 16px;
    box-shadow: inset 0 0 12px rgba(255,255,255,0.12), 0 12px 35px rgba(0,0,0,0.9);
  }
  .screen-bezel {
    width: 100%;
    background: #17171f;
    border-radius: 10px 10px 26px 10px;
    padding: 10px 14px 14px 14px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bezel-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    font-size: 10px;
    color: #9ca3af;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  .power-led {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .led-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff2a2a;
    box-shadow: 0 0 6px #ff2a2a;
  }
  .canvas-wrap {
    width: 100%;
    aspect-ratio: 10 / 9;
    background: #f8f0d8;
    border: 3px solid #08080c;
    border-radius: 4px;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  .gbc-logo {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 1.5px;
    color: #b8b8c8;
  }
  .gbc-logo .c1 { color: #ff3b56; }
  .gbc-logo .c2 { color: #a855f7; }
  .gbc-logo .c3 { color: #22c55e; }
  .gbc-logo .c4 { color: #eab308; }
  .gbc-logo .c5 { color: #3b82f6; }

  .hud-strip {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    font-size: 10px;
    font-weight: bold;
    color: #e9d5ff;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    margin-top: 4px;
  }

  .controls-area {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding-top: 4px;
  }
  .main-pad-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 6px;
  }
  .dpad {
    position: relative;
    width: 132px;
    height: 132px;
  }
  .dpad-btn {
    position: absolute;
    background: #1e1e26;
    border: 2px solid #101015;
    box-shadow: 0 4px 0 #09090c;
    color: #777;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #09090c;
    background: #2e2e3a;
    color: #fff;
  }
  .dpad-up { top: 0; left: 44px; width: 44px; height: 46px; border-radius: 6px 6px 0 0; }
  .dpad-down { bottom: 0; left: 44px; width: 44px; height: 46px; border-radius: 0 0 6px 6px; }
  .dpad-left { top: 44px; left: 0; width: 46px; height: 44px; border-radius: 6px 0 0 6px; }
  .dpad-right { top: 44px; right: 0; width: 46px; height: 44px; border-radius: 0 6px 6px 0; }
  .dpad-center {
    position: absolute;
    top: 44px;
    left: 44px;
    width: 44px;
    height: 44px;
    background: #1e1e26;
    z-index: 2;
    pointer-events: none;
  }
  .dpad-center::after {
    content: '';
    display: block;
    width: 22px;
    height: 22px;
    margin: 11px;
    border-radius: 50%;
    background: radial-gradient(circle, #14141a 20%, #252530 100%);
  }

  .ab-cluster {
    display: flex;
    gap: 16px;
    transform: rotate(-24deg);
    background: rgba(0,0,0,0.2);
    padding: 12px 16px;
    border-radius: 40px;
  }
  .ab-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ab-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff3b6b, #b80f3a);
    border: 2px solid #5a061c;
    box-shadow: 0 5px 0 #3d0312, 0 6px 10px rgba(0,0,0,0.6);
    color: rgba(255,255,255,0.9);
    font-weight: 900;
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .ab-btn:active, .ab-btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #3d0312;
  }
  .ab-label {
    margin-top: 5px;
    font-weight: 900;
    font-size: 11px;
    color: #c4b5fd;
  }

  .meta-row {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 2px;
  }
  .pill-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pill-btn {
    width: 48px;
    height: 14px;
    background: #252530;
    border: 2px solid #101016;
    border-radius: 10px;
    box-shadow: 0 2px 0 #08080c;
    transform: rotate(-24deg);
    cursor: pointer;
    touch-action: manipulation;
  }
  .pill-btn:active {
    transform: rotate(-24deg) translateY(2px);
    box-shadow: none;
  }
  .pill-label {
    margin-top: 7px;
    font-size: 9px;
    font-weight: bold;
    color: #9ca3af;
    letter-spacing: 0.8px;
  }
</style>
</head>
<body>

<div class="gbc-shell">
  <div class="screen-bezel">
    <div class="bezel-top">
      <div class="power-led">
        <div class="led-dot"></div>
        <span>SALEM GPS</span>
      </div>
      <span id="coordLabel">X:36 Y:20</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="gbcCanvas" width="160" height="144"></canvas>
    </div>
    <div class="gbc-logo">
      GAME BOY <span class="c1">C</span><span class="c2">O</span><span class="c3">L</span><span class="c4">O</span><span class="c5">R</span>
    </div>
  </div>

  <div class="hud-strip">
    <span id="streetLabel">ESSEX PEDESTRIAN MALL</span>
    <span id="tourLabel">TOUR: 0/15</span>
    <span id="spiritsLabel">LOG: 0/6</span>
  </div>

  <div class="controls-area">
    <div class="main-pad-row">
      <div class="dpad">
        <div class="dpad-btn dpad-up" data-key="UP">▲</div>
        <div class="dpad-btn dpad-down" data-key="DOWN">▼</div>
        <div class="dpad-btn dpad-left" data-key="LEFT">◀</div>
        <div class="dpad-btn dpad-right" data-key="RIGHT">▶</div>
        <div class="dpad-center"></div>
      </div>

      <div class="ab-cluster">
        <div class="ab-btn-wrap">
          <div class="ab-btn" data-key="B">B</div>
          <div class="ab-label">B / BACK</div>
        </div>
        <div class="ab-btn-wrap">
          <div class="ab-btn" data-key="A">A</div>
          <div class="ab-label">A / CHECK</div>
        </div>
      </div>
    </div>

    <div class="meta-row">
      <div class="pill-wrap">
        <div class="pill-btn" data-key="SELECT"></div>
        <div class="pill-label">SELECT (GPS MAP)</div>
      </div>
      <div class="pill-wrap">
        <div class="pill-btn" data-key="START"></div>
        <div class="pill-label">START (GUIDE/SND)</div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('gbcCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // --- GBC 56-COLOR PALETTE ---
  const PAL = {
    BG_CREAM: '#f8f0d8',
    INK: '#181020',
    BRICK: '#b83c28',
    BRICK_HI: '#d86850',
    PAVE: '#c8c0b0',
    PAVE_DARK: '#888070',
    GRASS: '#488838',
    LEAF_ORG: '#e87820',
    LEAF_YEL: '#f8b830',
    WATER: '#205098',
    WATER_HI: '#5088d8',
    WOOD: '#885830',
    WOOD_HI: '#b07848',
    ROOF_PURP: '#483068',
    ROOF_SLATE: '#384050',
    WALL_TAN: '#e0d0b0',
    WALL_BRICK: '#983028',
    STONE: '#9098a0',
    GOLD: '#f8c830',
    GHOST_CYAN: '#78e8d8',
    TORTIE_ORG: '#d87028',
    FENCE: '#282830',
    HP_GREEN: '#38b848',
    HP_RED: '#d83030'
  };

  // --- FAITHFUL 80x60 SALEM CITY GRID GENERATOR ---
  // Tile Legend:
  // 0: Asphalt / Sidewalk Street (Walkable)
  // 1: Red Brick Pedestrian Mall / Derby Sq (Walkable)
  // 2: Historic Clapboard / Brick Wall (Solid)
  // 3: Gabled Slate Roof (Solid)
  // 4: Autumn Tree (Solid)
  // 5: Haunted Grass / October Leaves (Walkable - Encounters)
  // 6: Salem Harbor Water (Solid)
  // 7: Derby Wharf Timber Planks (Walkable)
  // 8: Cemetery Headstone / Statue (Solid - Read)
  // 9: Gold Historic Landmark Plaque / Door (Solid - Walking Tour Stamp!)
  // 10: Iron Fence / Train Tunnel Wall (Solid)
  const MAP_W = 80;
  const MAP_H = 60;
  const WORLD_MAP = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(4));

  function fillRect(x0, y0, w, h, tile) {
    for (let y = Math.max(0, y0); y < Math.min(MAP_H, y0 + h); y++) {
      for (let x = Math.max(0, x0); x < Math.min(MAP_W, x0 + w); x++) {
        WORLD_MAP[y][x] = tile;
      }
    }
  }

  function buildBuilding(x, y, w, h, plaqueX = null, landmarkId = null) {
    fillRect(x, y, w, h - 1, 3); // Gabled Roof
    fillRect(x, y + h - 1, w, 1, 2); // Front Facade
    if (plaqueX !== null) {
      WORLD_MAP[y + h - 1][plaqueX] = 9;
      if (landmarkId) {
        LANDMARK_COORDS[`${plaqueX},${y + h - 1}`] = landmarkId;
      }
    }
  }

  // --- 15 REAL SALEM WALKING TOUR LANDMARKS ---
  const LANDMARKS = {
    ropes: {
      id: 'ropes',
      title: 'ROPES MANSION (318 Essex St)',
      desc: 'ROPES MANSION (1727): Georgian Revival home operated by PEM. Famous for its colonial gardens—and as Alison\'s house in Hocus Pocus!'
    },
    witch_house: {
      id: 'witch_house',
      title: 'THE WITCH HOUSE (310 Essex St)',
      desc: 'THE WITCH HOUSE (c. 1642): Home of Judge Jonathan Corwin. The only structure still standing in Salem with direct ties to the 1692 Witch Trials.'
    },
    mbta_portal: {
      id: 'mbta_portal',
      title: 'OLD WASHINGTON ST TUNNEL (1839)',
      desc: 'GRANITE TRAIN PORTAL (Washington St): Built in 1839 by the Eastern Railroad right underneath downtown Washington Street.'
    },
    howard_cemetery: {
      id: 'howard_cemetery',
      title: 'HOWARD ST CEMETERY (1801)',
      desc: 'HOWARD ST CEMETERY (Bridge & Howard): Traditionally held to be the field where Giles Corey was pressed to death on Sept 19, 1692.'
    },
    lyceum: {
      id: 'lyceum',
      title: 'SALEM LYCEUM (43 Church St)',
      desc: 'SALEM LYCEUM HALL (1831): Where Alexander Graham Bell made the first public demonstration of the long-distance telephone in 1877!'
    },
    bewitched: {
      id: 'bewitched',
      title: 'BEWITCHED STATUE (Essex & Wash)',
      desc: 'BEWITCHED STATUE (2005): Bronze statue of Elizabeth Montgomery as Samantha Stephens at the corner of Essex & Washington St.'
    },
    old_town_hall: {
      id: 'old_town_hall',
      title: 'OLD TOWN HALL (32 Derby Sq)',
      desc: 'OLD TOWN HALL (1816): Federal-style market house and civic hall designed by Charles Bulfinch in the heart of Derby Square.'
    },
    pem: {
      id: 'pem',
      title: 'PEABODY ESSEX MUSEUM (161 Essex)',
      desc: 'PEABODY ESSEX MUSEUM (Founded 1799): One of the oldest continuously operating museums in America, housing global maritime treasures.'
    },
    burying_point: {
      id: 'burying_point',
      title: 'OLD BURYING POINT (Charter St)',
      desc: 'CHARTER ST CEMETERY (Est. 1637): Final resting place of Judge John Hathorne, Mayflower passenger Richard More, and colonial governors.'
    },
    memorial: {
      id: 'memorial',
      title: 'WITCH TRIALS MEMORIAL (Liberty)',
      desc: 'WITCH TRIALS MEMORIAL (1992): Twenty granite benches cantilevered from the stone wall bearing the names of the innocent executed in 1692.'
    },
    hawthorne_hotel: {
      id: 'hawthorne_hotel',
      title: 'HAWTHORNE HOTEL (18 Wash Sq W)',
      desc: 'HAWTHORNE HOTEL (1925): Historic brick hotel overlooking Salem Common. Hosted the cast of Bewitched in 1970.'
    },
    witch_museum: {
      id: 'witch_museum',
      title: 'SALEM WITCH MUSEUM (Wash Sq N)',
      desc: 'SALEM WITCH MUSEUM (1846 Stone Church): Iconic Gothic Revival church facing Salem Common.'
    },
    salem_common: {
      id: 'salem_common',
      title: 'SALEM COMMON BANDSTAND',
      desc: 'SALEM COMMON (1636): 8-acre public park where the Massachusetts Bay militia muster held the first National Guard drill in 1637.'
    },
    custom_house: {
      id: 'custom_house',
      title: 'U.S. CUSTOM HOUSE (178 Derby St)',
      desc: 'U.S. CUSTOM HOUSE (1819): Where Nathaniel Hawthorne worked as Surveyor of the Port in 1846 and conceived The Scarlet Letter.'
    },
    seven_gables: {
      id: 'seven_gables',
      title: 'HOUSE OF SEVEN GABLES (54 Turner)',
      desc: 'THE HOUSE OF THE SEVEN GABLES (1668): The Turner-Ingersoll Mansion right on the harbor that inspired Hawthorne\'s 1851 Gothic novel.'
    }
  };

  const LANDMARK_COORDS = {};

  function generateSalemMap() {
    // 1. Base Greenery & Haunted Autumn Leaves
    fillRect(2, 2, 76, 36, 5);

    // 2. Salem Harbor (South of Y=38)
    fillRect(0, 38, 80, 22, 6);

    // 3. Major North-South Streets
    fillRect(15, 2, 3, 30, 0); // North St / Summer St
    fillRect(27, 2, 4, 34, 0); // Washington St (Wide main artery)
    fillRect(42, 12, 2, 26, 0); // Central St / Liberty St
    fillRect(54, 4, 4, 34, 0); // Hawthorne Blvd / Washington Sq W

    // 4. Major East-West Streets
    fillRect(10, 5, 50, 2, 0); // Bridge St / Howard St Corridor
    fillRect(15, 12, 42, 2, 0); // Church St
    fillRect(2, 19, 26, 3, 0); // West Essex St (Ropes Mansion & Witch House)
    fillRect(27, 19, 28, 3, 1); // ESSEX ST RED BRICK PEDESTRIAN MALL!
    fillRect(55, 19, 20, 3, 0); // East Essex St
    fillRect(27, 27, 30, 2, 0); // Charter St
    fillRect(15, 35, 62, 3, 0); // Derby St Waterfront Corridor

    // 5. Howard Street Cemetery (North of Church, East of Washington)
    fillRect(32, 6, 14, 5, 5);
    WORLD_MAP[8][35] = 8;
    WORLD_MAP[8][39] = 8;
    WORLD_MAP[9][42] = 9;
    LANDMARK_COORDS['42,9'] = 'howard_cemetery';

    // 6. Ropes Mansion & Gardens (318 Essex St - Far West)
    buildBuilding(5, 15, 6, 4, 8, 'ropes');
    fillRect(5, 11, 6, 4, 5); // Ropes Gardens

    // 7. The Witch House (310 Essex St - Corner of Essex & North St)
    buildBuilding(12, 15, 5, 4, 14, 'witch_house');

    // 8. Washington St Train Tunnel Portal
    WORLD_MAP[10][28] = 10;
    WORLD_MAP[10][29] = 9;
    LANDMARK_COORDS['29,10'] = 'mbta_portal';

    // 9. Salem Lyceum (43 Church St)
    buildBuilding(20, 8, 5, 4, 22, 'lyceum');

    // 10. Bewitched Statue (Corner of Essex & Washington St)
    WORLD_MAP[19][26] = 9;
    LANDMARK_COORDS['26,19'] = 'bewitched';

    // 11. Essex Street Pedestrian Mall Shops (Rockafellas, Witch Shops, Bookstores)
    buildBuilding(31, 15, 5, 4);
    buildBuilding(37, 15, 5, 4);

    // 12. Peabody Essex Museum (PEM - 161 Essex St)
    buildBuilding(44, 14, 9, 5, 48, 'pem');

    // 13. Derby Square & Old Town Hall (South of Essex Mall between Wash & Central)
    fillRect(31, 22, 10, 5, 1); // Red brick Derby Square plaza
    buildBuilding(33, 23, 6, 3, 36, 'old_town_hall');

    // 14. Old Burying Point (Charter St Cemetery 1637) & Witch Trials Memorial
    fillRect(44, 22, 9, 5, 5);
    WORLD_MAP[23][46] = 8;
    WORLD_MAP[24][49] = 8;
    WORLD_MAP[26][47] = 9;
    LANDMARK_COORDS['47,26'] = 'burying_point';

    // Witch Trials Memorial (Adjacent on Liberty St)
    WORLD_MAP[24][52] = 9;
    LANDMARK_COORDS['52,24'] = 'memorial';

    // 15. Hawthorne Hotel & Salem Witch Museum (Hawthorne Blvd & Wash Sq)
    buildBuilding(54, 14, 5, 4, 56, 'hawthorne_hotel');
    buildBuilding(61, 5, 7, 4, 64, 'witch_museum');

    // 16. SALEM COMMON (Large Fenced Octagonal Park on East Side)
    fillRect(60, 10, 15, 15, 5);
    // Iron Fence Border with Gates
    for (let x = 60; x < 75; x++) {
      WORLD_MAP[10][x] = 10;
      WORLD_MAP[24][x] = 10;
    }
    for (let y = 10; y < 25; y++) {
      WORLD_MAP[y][60] = 10;
      WORLD_MAP[y][74] = 10;
    }
    WORLD_MAP[17][60] = 0; // West Arch Gate
    WORLD_MAP[10][64] = 0; // North Gate toward Witch Museum
    WORLD_MAP[24][67] = 0; // South Gate
    // Bandstand in center of Salem Common
    WORLD_MAP[17][67] = 9;
    LANDMARK_COORDS['67,17'] = 'salem_common';

    // 17. U.S. Custom House (178 Derby St)
    buildBuilding(46, 31, 7, 4, 49, 'custom_house');

    // 18. DERBY WHARF (Long wooden pier extending south into Salem Harbor)
    fillRect(48, 38, 3, 19, 7);
    // Derby Wharf Light Station at tip (Y=56)
    WORLD_MAP[56][49] = 8;

    // 19. House of the Seven Gables (54 Turner St - Far Southeast Waterfront)
    fillRect(71, 35, 3, 6, 0); // Turner St going down to harbor
    buildBuilding(72, 31, 6, 4, 74, 'seven_gables');
  }

  generateSalemMap();

  // --- NPCs ACROSS DOWNTOWN SALEM ---
  const NPCS = [
    {
      id: 'beans',
      name: 'JULIETTE (BEANS)',
      type: 'cat',
      x: 35, y: 20, // Right on Essex St Red Bricks!
      heal: true,
      dialog: [
        'JULIETTE (BEANS): *Mrrp!* (Your favorite tortie cat is loafing on the warm Essex St bricks.)',
        'She headbutts your shin! SANITY fully restored & 3 CIDER DONUTS restocked!'
      ]
    },
    {
      id: 'giles',
      name: 'GILES COREY',
      type: 'ghost',
      x: 38, y: 8, // Howard St Cemetery
      dialog: [
        'GILES COREY: "More weight! ...Though honestly, October traffic on Bridge St is heavier."',
        'GILES COREY: "Did you check the plaque here at Howard St Cemetery yet?"'
      ]
    },
    {
      id: 'corwin',
      name: 'JUDGE CORWIN SHADE',
      type: 'ghost',
      x: 14, y: 20, // Outside The Witch House
      dialog: [
        'SPECTRAL JUDGE: "My 1642 house at 310 Essex St is the last building standing from the Trials."',
        'SPECTRAL JUDGE: "Walk further west to 318 Essex to see the Ropes Mansion gardens."'
      ]
    },
    {
      id: 'tourist_bewitched',
      name: 'MIDWEST TOURIST',
      type: 'tourist',
      x: 27, y: 21, // Corner of Essex & Washington
      dialog: [
        'TOURIST: "We just took 47 selfies with the Bewitched statue! Wait—where is the pirate museum?"',
        'YOU: "Head south down Washington or Central toward Derby Street."'
      ]
    },
    {
      id: 'derby_farmer',
      name: 'DERBY SQ VENDOR',
      type: 'tourist',
      x: 35, y: 26, // Derby Square
      dialog: [
        'MARKET VENDOR: "Old Town Hall right behind me dates to 1816! Grab some fresh apple cider!"'
      ]
    },
    {
      id: 'burying_guide',
      name: 'HIST. SOCIETY GUIDE',
      type: 'tourist',
      x: 47, y: 28, // Charter St
      dialog: [
        'TOUR GUIDE: "Welcome to Old Burying Point (1637) and the 1992 Witch Trials Memorial next door."',
        'TOUR GUIDE: "Press [A] on the gold plaques to stamp your 15-stop Salem Walking Tour!"'
      ]
    },
    {
      id: 'common_skater',
      name: 'INLINE SKATER',
      type: 'tourist',
      x: 57, y: 18, // Hawthorne Blvd / Salem Common
      dialog: [
        'SKATER: "The pavement loop around Salem Common is butter for 80mm urethane wheels, dude."'
      ]
    },
    {
      id: 'hawthorne',
      name: 'NATHANIEL HAWTHORNE',
      type: 'ghost',
      x: 49, y: 45, // Halfway out on Derby Wharf
      dialog: [
        'N. HAWTHORNE: "I stared out at Derby Wharf from the Custom House window every day in 1846."',
        'N. HAWTHORNE: "Walk east along Derby St to Turner St if you want to see the Seven Gables."'
      ]
    },
    {
      id: 'gables_cat',
      name: 'TURNER ST BLACK CAT',
      type: 'cat',

  // --- AUDIO ENGINE ---
  let audioCtx = null;
  let soundEnabled = false;
  let bgmTimer = null;
  let noteIdx = 0;
  const TOWN_NOTES = [293.66, 349.23, 440.00, 349.23, 329.63, 293.66, 261.63, 220.00];
  const BATTLE_NOTES = [392.00, 415.30, 392.00, 329.63, 466.16, 440.00, 392.00, 311.13];

  function toggleSound() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      playSfx(660, 0.08);
      startBgm();
    } else {
      stopBgm();
    }
  }

  function playSfx(freq, dur = 0.07, type = 'square') {
    if (!soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function startBgm() {
    stopBgm();
    if (!soundEnabled) return;
    bgmTimer = setInterval(() => {
      if (!soundEnabled) return;
      const list = state.mode === 'BATTLE' ? BATTLE_NOTES : TOWN_NOTES;
      playSfx(list[noteIdx % list.length], state.mode === 'BATTLE' ? 0.11 : 0.2, 'triangle');
      noteIdx++;
    }, state.mode === 'BATTLE' ? 160 : 320);
  }

  function stopBgm() {
    if (bgmTimer) clearInterval(bgmTimer);
    bgmTimer = null;
  }

  function vibrate(ms = 14) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  // --- GAME STATE ---
  const state = {
    mode: 'TITLE', // TITLE, EXPLORE, DIALOG, BATTLE, MINIMAP, GUIDE
    player: {
      x: 34,
      y: 20, // Starts right on Essex St Pedestrian Mall next to Beans!
      dir: 'DOWN',
      stepFrame: 0,
      hp: 45,
      maxHp: 45,

      visitedLandmarks: [],
      capturedSpirits: []
    },
    dialogQueue: [],
    battle: null,
    animTick: 0
  };

  // Load persistence
  try {
    const saved = localStorage.getItem('salem_1998_walking_tour');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.visitedLandmarks) state.player.visitedLandmarks = data.visitedLandmarks;
      if (data.capturedSpirits) state.player.capturedSpirits = data.capturedSpirits;
    }
  } catch (e) {}

  function saveGame() {
    try {
      localStorage.setItem('salem_1998_walking_tour', JSON.stringify({
        visitedLandmarks: state.player.visitedLandmarks,
        capturedSpirits: state.player.capturedSpirits
      }));
    } catch (e) {}
  }

  // --- REAL-TIME STREET NAME LOOKUP ---
  function getStreetName(x, y) {
    if (x >= 60 && x <= 74 && y >= 10 && y <= 24) return 'SALEM COMMON (1636)';
    if (y >= 38 && x >= 47 && x <= 51) return 'DERBY WHARF PIER';
    if (y >= 34 && y <= 38 && x >= 68) return 'TURNER ST / 7 GABLES';
    if (y >= 34 && y <= 38) return 'DERBY ST WATERFRONT';
    if (y >= 22 && y <= 27 && x >= 43 && x <= 53) return 'OLD BURYING POINT';
    if (y >= 22 && y <= 26 && x >= 31 && x <= 41) return 'DERBY SQUARE PLAZA';
    if (y >= 26 && y <= 29) return 'CHARTER STREET';
    if (y >= 18 && y <= 22 && x >= 27 && x <= 54) return 'ESSEX PEDESTRIAN MALL';
    if (y >= 18 && y <= 22 && x < 27) return 'WEST ESSEX (HISTORIC)';
    if (y >= 11 && y <= 14) return 'CHURCH STREET';
    if (y <= 10 && x >= 31 && x <= 46) return 'HOWARD ST CEMETERY';
    if (x >= 26 && x <= 31) return 'WASHINGTON STREET';
    if (x >= 53 && x <= 58) return 'HAWTHORNE BOULEVARD';
    if (x >= 14 && x <= 18) return 'NORTH / SUMMER ST';
    return 'DOWNTOWN SALEM MA';
  }

  function updateHud() {
    const { x, y, visitedLandmarks, capturedSpirits } = state.player;
    document.getElementById('coordLabel').textContent = `X:${x} Y:${y}`;
    document.getElementById('streetLabel').textContent = getStreetName(x, y);
    document.getElementById('tourLabel').textContent = `TOUR: ${visitedLandmarks.length}/15`;
    document.getElementById('spiritsLabel').textContent = `LOG: ${capturedSpirits.length}/6`;
  }

  // --- DIALOG & BATTLE LOGIC ---
  function startDialog(lines) {
    state.mode = 'DIALOG';
    state.dialogQueue = [...lines];
    playSfx(540, 0.06);
  }

  function startBattle() {
    const t = ENCOUNTERS[Math.floor(Math.random() * ENCOUNTERS.length)];
    state.mode = 'BATTLE';
    state.battle = {
      enemy: { ...t, hp: t.maxHp },
      phase: 'INTRO',
      cursor: 0,
      msg: t.intro,
      nextPhase: 'MENU'
    };
    playSfx(220, 0.14, 'sawtooth');
    startBgm();
  }

  function handleBattleChoice(idx) {
    const b = state.battle;
    const e = b.enemy;
    playSfx(600, 0.06);

    if (idx === 0) {
      // SEA SALT TOSS (Strong vs Ghosts, Solid vs Tourists)
      const dmg = 11 + Math.floor(Math.random() * 6);
      e.hp = Math.max(0, e.hp - dmg);
      b.msg = `Cast pure SEA SALT! ${e.name} lost ${dmg} EGO!`;
      b.phase = 'MSG';
      b.nextPhase = (e.hp <= 0) ? 'WIN' : 'ENEMY_TURN';
    } else if (idx === 1) {
      // IRON AMULET (Pacify & Log in Spirit Guide)
      const ratio = e.hp / e.maxHp;
      const chance = ratio < 0.55 ? 0.9 : 0.45;
      if (Math.random() < chance) {
        if (!state.player.capturedSpirits.includes(e.id)) {
          state.player.capturedSpirits.push(e.id);
          saveGame();
          updateHud();
        }
        playSfx(880, 0.18);
        b.msg = `IRON AMULET resonated! ${e.name} pacified & logged!`;
        b.phase = 'MSG';
        b.nextPhase = 'END';
      } else {
        b.msg = `${e.name} resisted the Iron Amulet! Use SEA SALT first!`;
        b.phase = 'MSG';
        b.nextPhase = 'ENEMY_TURN';
      }
    } else if (idx === 2) {
      // CIDER DONUT
      if (state.player.donuts > 0) {
        state.player.donuts--;
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 25);
        playSfx(740, 0.12);
        b.msg = `Ate a warm Cider Donut! +25 SANITY (${state.player.donuts} left).`;
        b.phase = 'MSG';
        b.nextPhase = 'ENEMY_TURN';
      } else {
        b.msg = `No Cider Donuts left! Visit BEANS on Essex St to restock!`;
        b.phase = 'MSG';
        b.nextPhase = 'MENU';
      }
    } else if (idx === 3) {
      // DUCK INTO DERBY ALLEY
      playSfx(310, 0.09);
      b.msg = `Cut through a historic brick alleyway and escaped!`;
      b.phase = 'MSG';
      b.nextPhase = 'END';
    }
  }

  function enemyTurn() {
    const b = state.battle;
    const e = b.enemy;
    const move = e.moves[Math.floor(Math.random() * e.moves.length)];
    const dmg = Math.max(2, e.atk - 2 + Math.floor(Math.random() * 4));
    state.player.hp = Math.max(1, state.player.hp - dmg);
    playSfx(175, 0.12, 'sawtooth');
    b.msg = `${e.name} used ${move}! -${dmg} SANITY!`;
    b.phase = 'MSG';
    b.nextPhase = 'MENU';
  }

  // --- INPUT HANDLER ---
  function onInput(key) {
    vibrate(12);

    if (state.mode === 'TITLE') {
      if (key === 'A' || key === 'START' || key === 'SELECT') {
        state.mode = 'EXPLORE';
        updateHud();
        playSfx(587.33, 0.1);
      }
      return;
    }

    // Toggle GPS Minimap with SELECT
    if (key === 'SELECT') {
      state.mode = (state.mode === 'MINIMAP') ? 'EXPLORE' : 'MINIMAP';
      playSfx(680, 0.06);
      return;
    }

    if (state.mode === 'MINIMAP') {
      if (key === 'A' || key === 'B' || key === 'START') {
        state.mode = 'EXPLORE';
      }
      return;
    }

    if (state.mode === 'GUIDE') {
      if (key === 'A') {
        toggleSound();
      } else if (key === 'B' || key === 'START') {
        state.mode = 'EXPLORE';
      }
      return;
    }

    if (state.mode === 'DIALOG') {
      if (key === 'A' || key === 'B') {
        state.dialogQueue.shift();
        playSfx(520, 0.05);
        if (state.dialogQueue.length === 0) {
          state.mode = 'EXPLORE';
        }
      }
      return;
    }

    if (state.mode === 'BATTLE') {
      const b = state.battle;
      if (b.phase === 'INTRO' || b.phase === 'MSG') {
        if (key === 'A' || key === 'B') {
          if (b.nextPhase === 'MENU') b.phase = 'MENU';
          else if (b.nextPhase === 'ENEMY_TURN') enemyTurn();
          else if (b.nextPhase === 'WIN') {
            if (!state.player.capturedSpirits.includes(b.enemy.id)) {
              state.player.capturedSpirits.push(b.enemy.id);
              saveGame();
              updateHud();
            }
            b.msg = `${b.enemy.name} cleared the way! Added to Spirit Log!`;
            b.nextPhase = 'END';
          } else if (b.nextPhase === 'END') {
            state.mode = 'EXPLORE';
            state.battle = null;
            startBgm();
          }
        }
      } else if (b.phase === 'MENU') {
        if (key === 'LEFT' && b.cursor % 2 === 1) b.cursor--;
        if (key === 'RIGHT' && b.cursor % 2 === 0) b.cursor++;
        if (key === 'UP' && b.cursor >= 2) b.cursor -= 2;
        if (key === 'DOWN' && b.cursor < 2) b.cursor += 2;
        if (key === 'A') handleBattleChoice(b.cursor);
      }
      return;
    }

    if (state.mode === 'EXPLORE') {
      if (key === 'START') {
        state.mode = 'GUIDE';
        playSfx(620, 0.06);
        return;
      }
      if (key === 'A') {
        interactFront();
        return;
      }

      let dx = 0, dy = 0;
      if (key === 'UP') { dy = -1; state.player.dir = 'UP'; }
      if (key === 'DOWN') { dy = 1; state.player.dir = 'DOWN'; }
      if (key === 'LEFT') { dx = -1; state.player.dir = 'LEFT'; }
      if (key === 'RIGHT') { dx = 1; state.player.dir = 'RIGHT'; }

      if (dx !== 0 || dy !== 0) {
        const nx = state.player.x + dx;
        const ny = state.player.y + dy;
        if (canWalk(nx, ny)) {
          state.player.x = nx;
          state.player.y = ny;
          state.player.stepFrame = (state.player.stepFrame + 1) % 2;
          playSfx(140, 0.02, 'triangle');
          updateHud();

          // Wild encounter check in cemetery grass / autumn leaves
          if (WORLD_MAP[ny][nx] === 5 && Math.random() < 0.14) {
            startBattle();
          }
        } else {
          playSfx(90, 0.03, 'sawtooth');
        }
      }
    }
  }

  function canWalk(x, y) {
    if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return false;
    const t = WORLD_MAP[y][x];
    if (![0, 1, 5, 7].includes(t)) return false;
    for (const npc of NPCS) {
      if (npc.x === x && npc.y === y) return false;
    }
    return true;
  }

  function interactFront() {
    let tx = state.player.x;
    let ty = state.player.y;
    if (state.player.dir === 'UP') ty--;
    if (state.player.dir === 'DOWN') ty++;
    if (state.player.dir === 'LEFT') tx--;
    if (state.player.dir === 'RIGHT') tx++;

    // 1. Check NPC
    const npc = NPCS.find(n => n.x === tx && n.y === ty);
    if (npc) {
      if (npc.heal) {
        state.player.hp = state.player.maxHp;
        state.player.donuts = 3;
      }
      startDialog(npc.dialog);
      return;
    }

    // 2. Check Verified Historical Landmark Plaque
    const coordKey = `${tx},${ty}`;
    if (LANDMARK_COORDS[coordKey]) {
      const lm = LANDMARKS[LANDMARK_COORDS[coordKey]];
      const isNew = !state.player.visitedLandmarks.includes(lm.id);
      if (isNew) {
        state.player.visitedLandmarks.push(lm.id);
        saveGame();
        updateHud();
        playSfx(880, 0.18);
      }
      startDialog([
        lm.desc,
        isNew
          ? `★ STAMPED IN TOUR GUIDE! (${state.player.visitedLandmarks.length}/15 Landmarks Visited)`
          : `✓ Already stamped in your Salem Walking Tour Guide.`
      ]);
      return;
    }

    // 3. Check Derby Wharf Lighthouse or Cemetery Stones
    const tile = WORLD_MAP[ty] && WORLD_MAP[ty][tx];
    if (tile === 8) {
      if (ty >= 50) {
        startDialog(['DERBY WHARF LIGHT STATION (1871): Historic white square lighthouse marking the end of Derby Wharf.']);
      } else {
        startDialog(['COLONIAL SLATE HEADSTONE: Carved with a winged death\'s head skull and hourglass.']);
      }
    } else if (tile === 2) {
      startDialog(['HISTORIC SALEM SHOPFRONT: The window is full of tarot decks, black candles, and witch hats.']);
    }
  }

  // --- DRAWING FUNCTIONS ---
  function drawTile(tx, ty, sx, sy) {
    const t = WORLD_MAP[ty][tx];
    ctx.fillStyle = PAL.PAVE;
    ctx.fillRect(sx, sy, 16, 16);

    if (t === 0) {
      ctx.fillStyle = PAL.PAVE_DARK;
      ctx.fillRect(sx + 3, sy + 4, 2, 2);
      ctx.fillRect(sx + 11, sy + 11, 2, 2);
    } else if (t === 1) {
      // Essex St Red Brick Mall
      ctx.fillStyle = PAL.BRICK;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = PAL.BRICK_HI;
      ctx.fillRect(sx + 1, sy + 1, 6, 3);
      ctx.fillRect(sx + 9, sy + 5, 6, 3);
      ctx.fillRect(sx + 2, sy + 9, 6, 3);
      ctx.fillRect(sx + 8, sy + 13, 6, 2);
    } else if (t === 2) {
      // Historic Building Facade
      ctx.fillStyle = PAL.WALL_TAN;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx, sy + 14, 16, 2);
      ctx.fillRect(sx + 4, sy + 3, 8, 8);
      ctx.fillStyle = PAL.GOLD;
      ctx.fillRect(sx + 5, sy + 4, 6, 6);
    } else if (t === 3) {
      // Slate Gabled Roof
      ctx.fillStyle = PAL.ROOF_PURP;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx, sy + 7, 16, 1);
      ctx.fillRect(sx, sy + 15, 16, 1);
    } else if (t === 4) {
      // Autumn Tree
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx + 6, sy + 11, 4, 5);
      ctx.fillStyle = PAL.LEAF_ORG;
      ctx.fillRect(sx + 2, sy + 2, 12, 10);
      ctx.fillStyle = PAL.LEAF_YEL;
      ctx.fillRect(sx + 4, sy + 3, 6, 5);
    } else if (t === 5) {
      // Grass + October Leaves
      ctx.fillStyle = PAL.GRASS;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = PAL.LEAF_ORG;
      ctx.fillRect(sx + 2, sy + 3, 3, 3);
      ctx.fillRect(sx + 11, sy + 10, 3, 3);
      ctx.fillStyle = PAL.LEAF_YEL;
      ctx.fillRect(sx + 7, sy + 12, 2, 2);
    } else if (t === 6) {
      // Salem Harbor Water
      ctx.fillStyle = PAL.WATER;
      ctx.fillRect(sx, sy, 16, 16);
      const shift = (Math.floor(state.animTick / 20) + tx) % 2 === 0 ? 2 : 0;
      ctx.fillStyle = PAL.WATER_HI;
      ctx.fillRect(sx + 2 + shift, sy + 5, 6, 2);
      ctx.fillRect(sx + 7 - shift, sy + 12, 5, 2);
    } else if (t === 7) {
      // Derby Wharf Planks
      ctx.fillStyle = PAL.WOOD;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = PAL.WOOD_HI;
      ctx.fillRect(sx + 1, sy + 1, 14, 3);
      ctx.fillRect(sx + 1, sy + 6, 14, 3);
      ctx.fillRect(sx + 1, sy + 11, 14, 3);
    } else if (t === 8) {
      // Headstone or Derby Light
      ctx.fillStyle = ty >= 50 ? PAL.WOOD : PAL.GRASS;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = ty >= 50 ? PAL.BG_CREAM : PAL.STONE;
      ctx.fillRect(sx + 4, sy + 2, 8, 12);
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx + 6, sy + 5, 4, 2);
    } else if (t === 9) {
      // Gold Historic Plaque / Landmark Entrance
      ctx.fillStyle = PAL.WALL_TAN;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = PAL.BRICK;
      ctx.fillRect(sx + 3, sy + 2, 10, 14);
      // Shimmering Gold Tour Plaque
      ctx.fillStyle = (Math.floor(state.animTick / 15) % 2 === 0) ? PAL.GOLD : PAL.LEAF_ORG;
      ctx.fillRect(sx + 5, sy + 5, 6, 5);
    } else if (t === 10) {
      // Ornate Iron Fence (Salem Common / Tunnel)
      ctx.fillStyle = PAL.GRASS;
      ctx.fillRect(sx, sy, 16, 16);
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx, sy + 6, 16, 3);
      ctx.fillRect(sx + 2, sy + 2, 2, 12);
      ctx.fillRect(sx + 7, sy + 2, 2, 12);
      ctx.fillRect(sx + 12, sy + 2, 2, 12);
    }
  }

  function drawSprite(sx, sy, type, step = 0) {
    if (type === 'player') {
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx + 3, sy + 1, 10, 14);
      ctx.fillStyle = PAL.BG_CREAM;
      ctx.fillRect(sx + 5, sy + 4, 6, 4);
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx + 5, sy + 5, 2, 2);
      ctx.fillRect(sx + 9, sy + 5, 2, 2);
      ctx.fillStyle = PAL.BRICK_HI;
      ctx.fillRect(sx + 4, sy + 8, 8, 2);
      ctx.fillStyle = PAL.STONE;
      ctx.fillRect(sx + 4, sy + 14 + (step ? -1 : 0), 3, 2);
      ctx.fillRect(sx + 9, sy + 14 + (step ? 0 : -1), 3, 2);
    } else if (type === 'cat') {
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx + 4, sy + 6, 8, 8);
      ctx.fillRect(sx + 4, sy + 4, 2, 2);
      ctx.fillRect(sx + 10, sy + 4, 2, 2);
      ctx.fillStyle = PAL.TORTIE_ORG;
      ctx.fillRect(sx + 5, sy + 6, 3, 3);
      ctx.fillRect(sx + 8, sy + 10, 3, 3);
      ctx.fillStyle = PAL.GOLD;
      ctx.fillRect(sx + 5, sy + 8, 2, 2);
      ctx.fillRect(sx + 9, sy + 8, 2, 2);
    } else if (type === 'ghost') {
      ctx.fillStyle = PAL.GHOST_CYAN;
      ctx.fillRect(sx + 3, sy + 2, 10, 12);
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx + 5, sy + 5, 2, 3);
      ctx.fillRect(sx + 9, sy + 5, 2, 3);
    } else {
      ctx.fillStyle = PAL.INK;
      ctx.fillRect(sx + 2, sy + 3, 12, 2);
      ctx.fillRect(sx + 5, sy + 0, 6, 3);
      ctx.fillStyle = PAL.BG_CREAM;
      ctx.fillRect(sx + 5, sy + 5, 6, 4);
      ctx.fillStyle = PAL.LEAF_ORG;
      ctx.fillRect(sx + 4, sy + 9, 8, 6);
    }
  }

  // --- GPS MINIMAP OVERLAY (SELECT BUTTON) ---
  function renderMinimap() {
    ctx.fillStyle = PAL.INK;
    ctx.fillRect(0, 0, 160, 144);

    // Draw 80x60 map scaled 2x horizontal, 2x vertical in center (160x120)
    const offsetY = 14;
    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        const t = WORLD_MAP[y][x];
        let col = '#2a3828';
        if (t === 0) col = '#908878';
        else if (t === 1) col = '#d85038';
        else if (t === 2 || t === 3) col = '#584078';
        else if (t === 6) col = '#184080';
        else if (t === 7) col = '#a07040';
        else if (t === 9) col = PAL.GOLD;
        ctx.fillStyle = col;
        ctx.fillRect(x * 2, offsetY + y * 2, 2, 2);
      }
    }

    // Blinking Gold Dots for Unvisited Landmarks, Green for Visited
    for (const [coord, id] of Object.entries(LANDMARK_COORDS)) {
      const [lx, ly] = coord.split(',').map(Number);
      const visited = state.player.visitedLandmarks.includes(id);
      ctx.fillStyle = visited ? PAL.HP_GREEN : PAL.GOLD;
      ctx.fillRect(lx * 2 - 1, offsetY + ly * 2 - 1, 3, 3);
    }

    // Blinking Player GPS Dot
    if (Math.floor(state.animTick / 10) % 2 === 0) {
      ctx.fillStyle = '#ff2a2a';
      ctx.fillRect(state.player.x * 2 - 2, offsetY + state.player.y * 2 - 2, 5, 5);
    }

    // Header Bar
    ctx.fillStyle = PAL.INK;
    ctx.fillRect(0, 0, 160, 14);
    ctx.fillStyle = PAL.GOLD;
    ctx.font = 'bold 8px monospace';
    ctx.fillText(`GPS RADAR: ${getStreetName(state.player.x, state.player.y)}`, 4, 10);

    // Footer Legend
    ctx.fillStyle = PAL.INK;
    ctx.fillRect(0, 134, 160, 10);
    ctx.fillStyle = PAL.BG_CREAM;
    ctx.fillText('RED:YOU  GOLD:PLAQUE  [SELECT]:EXIT', 4, 142);
  }

  // --- START MENU / WALKING TOUR CHECKLIST ---
  function renderGuideMenu() {
    ctx.fillStyle = PAL.BG_CREAM;
    ctx.fillRect(6, 6, 148, 132);
    ctx.strokeStyle = PAL.INK;
    ctx.lineWidth = 2;
    ctx.strokeRect(8, 8, 144, 128);

    ctx.fillStyle = PAL.INK;
    ctx.font = 'bold 8px monospace';
    ctx.fillText(`WALKING TOUR: ${state.player.visitedLandmarks.length}/15`, 14, 20);
    ctx.fillText(`[A] SOUND: ${soundEnabled ? 'ON' : 'OFF'}`, 100, 20);

    const keys = Object.keys(LANDMARKS);
    keys.slice(0, 12).forEach((k, i) => {
      const done = state.player.visitedLandmarks.includes(k);
      const label = LANDMARKS[k].title.split(' (')[0].substring(0, 19);
      ctx.fillStyle = done ? '#1e6b2b' : '#555';
      ctx.fillText(`${done ? '★' : '·'}${label}`, 14, 32 + i * 8);
    });
    ctx.fillStyle = PAL.INK;
    ctx.fillText('PRESS [SELECT] FOR FULL CITY MAP', 14, 131);
  }

  function drawTextBox(text) {
    ctx.fillStyle = PAL.BG_CREAM;
    ctx.fillRect(4, 92, 152, 48);
    ctx.strokeStyle = PAL.INK;
    ctx.lineWidth = 2;
    ctx.strokeRect(6, 94, 148, 44);

    ctx.fillStyle = PAL.INK;
    ctx.font = 'bold 8px monospace';
    const words = text.split(' ');
    let line = '';
    let y = 106;
    for (let w of words) {
      if ((line + w).length > 22) {
        ctx.fillText(line.trim(), 10, y);
        line = w + ' ';
        y += 9;
      } else {
        line += w + ' ';
      }
    }
    if (line) ctx.fillText(line.trim(), 10, y);
  }

  function renderExplore() {
    const camX = state.player.x - 4;
    const camY = state.player.y - 4;

    for (let gy = 0; gy < 9; gy++) {
      for (let gx = 0; gx < 10; gx++) {
        const mx = camX + gx;
        const my = camY + gy;
        const sx = gx * 16;
        const sy = gy * 16;
        if (mx >= 0 && mx < MAP_W && my >= 0 && my < MAP_H) {
          drawTile(mx, my, sx, sy);
        } else {
          ctx.fillStyle = PAL.INK;
          ctx.fillRect(sx, sy, 16, 16);
        }
      }
    }

    for (const npc of NPCS) {
      const gx = npc.x - camX;
      const gy = npc.y - camY;
      if (gx >= 0 && gx < 10 && gy >= 0 && gy < 9) {
        drawSprite(gx * 16, gy * 16, npc.type);
      }
    }

    drawSprite(4 * 16, 4 * 16, 'player', state.player.stepFrame);

    if (state.mode === 'DIALOG' && state.dialogQueue.length > 0) {
      drawTextBox(state.dialogQueue[0]);
    } else if (state.mode === 'GUIDE') {
      renderGuideMenu();
    }
  }

  function renderBattle() {
    const b = state.battle;
    const e = b.enemy;

    ctx.fillStyle = PAL.BG_CREAM;
    ctx.fillRect(0, 0, 160, 144);

    ctx.fillStyle = PAL.INK;
    ctx.font = 'bold 8px monospace';
    ctx.fillText(`${e.name} :L${e.lvl}`, 8, 14);
    ctx.fillRect(8, 18, 66, 6);
    const eRatio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = eRatio > 0.3 ? PAL.HP_GREEN : PAL.HP_RED;
    ctx.fillRect(9, 19, Math.floor(64 * eRatio), 4);

    const ex = 108, ey = 14;
    ctx.fillStyle = e.type === 'ghost' ? PAL.GHOST_CYAN : PAL.LEAF_ORG;
    ctx.fillRect(ex, ey, 32, 32);
    ctx.strokeStyle = PAL.INK;
    ctx.strokeRect(ex, ey, 32, 32);
    ctx.fillStyle = PAL.INK;
    ctx.fillRect(ex + 6, ey + 10, 6, 6);
    ctx.fillRect(ex + 20, ey + 10, 6, 6);
    ctx.fillRect(ex + 8, ey + 22, 16, 4);

    ctx.fillStyle = PAL.INK;
    ctx.fillRect(14, 58, 28, 28);
    ctx.fillStyle = PAL.BRICK_HI;
    ctx.fillRect(16, 72, 24, 6);

    ctx.fillStyle = PAL.INK;
    ctx.fillText(`LOCAL (YOU)`, 78, 66);
    ctx.fillText(`SANITY: ${state.player.hp}/${state.player.maxHp}`, 78, 78);
    ctx.fillRect(78, 82, 66, 6);
    const pRatio = Math.max(0, state.player.hp / state.player.maxHp);
    ctx.fillStyle = pRatio > 0.3 ? PAL.HP_GREEN : PAL.HP_RED;
    ctx.fillRect(79, 83, Math.floor(64 * pRatio), 4);

    if (b.phase === 'MENU') {
      ctx.fillStyle = PAL.BG_CREAM;
      ctx.fillRect(4, 94, 152, 46);
      ctx.strokeStyle = PAL.INK;
      ctx.strokeRect(6, 96, 148, 42);

      const opts = ['SEA SALT', 'IRON AMULET', 'DONUT', 'ALLEYS'];
      ctx.fillStyle = PAL.INK;
      opts.forEach((opt, idx) => {
        const ox = (idx % 2 === 0) ? 12 : 82;
        const oy = (idx < 2) ? 112 : 128;
        ctx.fillText(`${b.cursor === idx ? '▶' : ' '}${opt}`, ox, oy);
      });
    } else {
      drawTextBox(b.msg);
    }
  }

  function renderTitle() {
    ctx.fillStyle = PAL.INK;
    ctx.fillRect(0, 0, 160, 144);

    ctx.fillStyle = PAL.LEAF_YEL;
    ctx.beginPath();
    ctx.arc(80, 44, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = PAL.ROOF_PURP;
    ctx.fillRect(42, 46, 76, 30);

    ctx.fillStyle = PAL.BG_CREAM;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('SALEM 1998: GBC', 26, 22);

    ctx.fillStyle = PAL.GHOST_CYAN;
    ctx.font = 'bold 8px monospace';
    ctx.fillText('HISTORIC WALKING TOUR RPG', 16, 90);

    ctx.fillStyle = PAL.LEAF_ORG;
    ctx.fillText('80x60 REAL STREET GRID', 22, 104);
    ctx.fillText('15 VERIFIED LANDMARKS', 24, 114);

    if (Math.floor(state.animTick / 25) % 2 === 0) {
      ctx.fillStyle = PAL.GOLD;
      ctx.fillText('PRESS [A] TO START TOUR', 20, 132);
    }
  }

  function loop() {
    state.animTick++;
    if (state.mode === 'TITLE') renderTitle();
    else if (state.mode === 'MINIMAP') renderMinimap();
    else if (state.mode === 'BATTLE') renderBattle();
    else renderExplore();
    requestAnimationFrame(loop);
  }
  loop();

  // --- CONTROLS BINDING (WITH HOLD-TO-WALK SUPPORT!) ---
  let holdInterval = null;
  function startHold(key) {
    onInput(key);
    if (['UP', 'DOWN', 'LEFT', 'RIGHT'].includes(key)) {
      clearInterval(holdInterval);
      holdInterval = setInterval(() => onInput(key), 135);
    }
  }
  function stopHold() {
    clearInterval(holdInterval);
    holdInterval = null;
  }

  document.querySelectorAll('[data-key]').forEach(btn => {
    const key = btn.getAttribute('data-key');
    const trigger = (e) => {
      e.preventDefault();
      btn.classList.add('pressed');
      startHold(key);
    };
    const release = (e) => {
      e.preventDefault();
      btn.classList.remove('pressed');
      stopHold();
    };
    btn.addEventListener('touchstart', trigger, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('mousedown', trigger);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const map = {
      ArrowUp: 'UP', KeyW: 'UP',
      ArrowDown: 'DOWN', KeyS: 'DOWN',
      ArrowLeft: 'LEFT', KeyA: 'LEFT',
      ArrowRight: 'RIGHT', KeyD: 'RIGHT',
      KeyZ: 'A', Enter: 'A', Space: 'A',
      KeyX: 'B', Backspace: 'B',
      ShiftLeft: 'SELECT', ShiftRight: 'SELECT',
      KeyM: 'START'
    };
    if (map[e.code]) {
      e.preventDefault();
      startHold(map[e.code]);
    }
  });
  window.addEventListener('keyup', stopHold);
})();
</script>
</body>
</html>
