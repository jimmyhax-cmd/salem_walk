  <script>
  const SoundSystem = {
    ctx: null,
    enabled: false,

    init() {
      if (!this.ctx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.enabled = true;
      const btn = document.getElementById('audio-toggle');
      btn.innerText = "AUDIO: ON";
      btn.classList.replace('bg-[#9ba77b]', 'bg-[#306230]');
      btn.classList.add('text-white');
    },

    toggle() {
      if (!this.enabled) {
        this.init();
        this.playBeep(440, 'triangle', 0.08);
      } else {
        this.enabled = false;
        const btn = document.getElementById('audio-toggle');
        btn.innerText = "AUDIO: OFF";
        btn.classList.replace('bg-[#306230]', 'bg-[#9ba77b]');
        btn.classList.remove('text-white');
      }
    },

    playTone(freq, type = 'square', duration = 0.1, gainVal = 0.08) {
      if (!this.enabled || !this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      } catch (e) {
        console.error("Audio error", e);
      }
    },

    playBeep(freq = 520, type = 'square', dur = 0.06) {
      this.playTone(freq, type, dur, 0.05);
    },

    playStep() {
      if (!this.enabled || !this.ctx) return;
      this.playTone(85 + Math.random() * 25, 'triangle', 0.03, 0.02);
    },

    playSelect() {
      this.playTone(680, 'square', 0.07, 0.06);
    },

    playEncounter() {
      if (!this.enabled || !this.ctx) return;
      const notes = [220, 277, 330, 440, 554, 659];
      notes.forEach((f, i) => {
        setTimeout(() => this.playTone(f, 'sawtooth', 0.1, 0.06), i * 50);
      });
    },

    playWin() {
      if (!this.enabled || !this.ctx) return;
      const fanfare = [392, 523, 659, 784];
      fanfare.forEach((f, i) => {
        setTimeout(() => this.playTone(f, 'square', 0.14, 0.08), i * 85);
      });
    }
  };

  function getLandmarkName(px, py) {

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;

  function initTileSprites() {
    // 0: Cobblestone
    const { c: cobbleC, cx: cobbleX } = makeCanvas(16, 16);

  function drawPlayerSprite(context, x, y, dir, frame) {
    context.save();
    context.translate(x, y);

    context.fillStyle = PAL.L3;
    context.fillRect(4, 1, 8, 4);
    context.fillRect(3, 3, 10, 2);
    if (dir === 'left') context.fillRect(1, 3, 3, 2);
    if (dir === 'right') context.fillRect(12, 3, 3, 2);

    context.fillStyle = PAL.L0;
    context.fillRect(4, 5, 8, 4);

    context.fillStyle = PAL.L3;
    if (dir === 'down') {
      context.fillRect(5, 6, 2, 2);
      context.fillRect(9, 6, 2, 2);
    } else if (dir ===
