<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Salem 1998</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: #1a1c1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      font-family: monospace;
      padding: 10px;
    }
    #gameboy {
      background: #8b956d;
      border: 4px solid #2f381e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 0 #1b2011;
      width: 100%;
      max-width: 340px;
    }
    #screen-housing {
      background: #4a533a;
      padding: 12px 12px 8px 12px;
      border-radius: 6px;
      border: 3px solid #2b3121;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background: #9bbc0f;
      display: block;
      image-rendering: pixelated;
      border: 3px solid #0f380f;
      width: 256px;
      height: 240px;
    }
    #hud {
      color: #9bbc0f;
      font-size: 11px;
      font-weight: bold;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }
    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 18px;
      padding: 0 10px;
    }
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 42px);
      gap: 2px;
    }
    .d-btn {
      background: #2f381e;
      border: 2px solid #1b2011;
      border-radius: 4px;
      color: #8b956d;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .d-btn:active {
      background: #0f380f;
    }
    #action-btns {
      display: flex;
      gap: 12px;
      transform: rotate(-15deg);
    }
    .act-btn {
      background: #6b2434;
      border: 2px solid #360f18;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      color: #f7b2c0;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #20080d;
    }
    .act-btn:active {
      background: #40121d;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #20080d;
    }
  </style>
</head>
<body>

  <div id="gameboy">
    <div id="screen-housing">
      <canvas id="screen" width="160" height="144"></canvas>
      <div id="hud">SALEM: ESSEX ST</div>
    </div>

    <div id="controls">
      <div id="dpad">
        <div></div>
        <button class="d-btn" id="btn-up">▲</button>
        <div></div>
        <button class="d-btn" id="btn-left">◀</button>
        <button class="d-btn" id="btn-mid" style="background:#3b4625;">●</button>
        <button class="d-btn" id="btn-right">▶</button>
        <div></div>
        <button class="d-btn" id="btn-down">▼</button>
        <div></div>
      </div>

      <div id="action-btns">
        <button class="act-btn" id="btn-b">B</button>
        <button class="act-btn" id="btn-a">A</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    // Palette: Classic GB 4-Green
    const C = {
      LIGHTEST: '#9bbc0f',
      LIGHT: '#8bac0f',
      DARK: '#306230',
      DARKEST: '#0f380f'
    };

    // State
    let player = { x: 5, y: 4, dir: 'down', anim: 0 };
    let message = "Welcome to Salem. Tap D-Pad to move!";
    
    // Landmarks on a 10x9 grid
    const landmarks = {
      "2,2": "Old Town Hall (1816)",
      "7,2": "Hawthorne Hotel",
      "5,2": "Salem Common Gazebo",
      "2,6": "Howard St Cemetery",
      "7,6": "Essex St Pedestrian Mall"
    };

    function draw() {
      // Clear background
      ctx.fillStyle = C.LIGHTEST;
      ctx.fillRect(0, 0, 160, 144);

      // Cobblestone / path grid
      ctx.fillStyle = C.LIGHT;
      for (let x = 0; x < 10; x++) {
        for (let y = 0; y < 9; y++) {
          if ((x + y) % 2 === 0) {
            ctx.fillRect(x * 16, y * 16, 16, 16);
          }
        }
      }

      // Draw Landmarks
      for (const [pos, name] of Object.entries(landmarks)) {
        const [lx, ly] = pos.split(',').map(Number);
        ctx.fillStyle = C.DARKEST;
        ctx.fillRect(lx * 16 + 2, ly * 16 + 2, 12, 12);
        ctx.fillStyle = C.LIGHTEST;
        ctx.fillRect(lx * 16 + 4, ly * 16 + 4, 8, 8);
      }

      // Draw Player (Flat-Brim Cap & Jacket Sprite)
      const px = player.x * 16;
      const py = player.y * 16;

      // Shadow
      ctx.fillStyle = C.DARK;
      ctx.fillRect(px + 3, py + 13, 10, 3);

      // Body / Jacket
      ctx.fillStyle = C.DARKEST;
      ctx.fillRect(px + 4, py + 6, 8, 7);

      // Head
      ctx.fillStyle = C.LIGHTEST;
      ctx.fillRect(px + 5, py + 3, 6, 5);

      // Hat Brim
      ctx.fillStyle = C.DARKEST;
      if (player.dir === 'left') {
        ctx.fillRect(px + 2, py + 2, 7, 2);
      } else if (player.dir === 'right') {
        ctx.fillRect(px + 7, py + 2, 7, 2);
      } else {
        ctx.fillRect(px + 4, py + 2, 8, 2);
      }

      // Message Box at bottom
      ctx.fillStyle = C.DARKEST;
      ctx.fillRect(0, 114, 160, 30);
      ctx.fillStyle = C.LIGHTEST;
      ctx.fillRect(2, 116, 156, 26);
      ctx.fillStyle = C.DARKEST;
      ctx.font = '8px monospace';
      
      // Auto-wrap text inside dialogue box
      ctx.fillText(message.slice(0, 24), 6, 127);
      if (message.length > 24) {
        ctx.fillText(message.slice(24, 48), 6, 137);
      }
    }

    function move(dx, dy, dirName) {
      player.dir = dirName;
      const nx = player.x + dx;
      const ny = player.y + dy;

      if (nx >= 0 && nx < 10 && ny >= 0 && ny < 7) {
        player.x = nx;
        player.y = ny;
      }

      // Check Landmark Collision
      const key = `${player.x},${player.y}`;
      if (landmarks[key]) {
        message = `FOUND: ${landmarks[key]}`;
        hud.textContent = landmarks[key];
      } else {
        message = `Roaming Essex St (${player.x},${player.y})`;
        hud.textContent = "SALEM: ESSEX ST";
      }

      draw();
    }

    // Direct Pointer Listeners (Bypasses Mobile Scrolling and Click Latency)
    const bindBtn = (id, action) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        action();
      });
    };

    bindBtn('btn-up', () => move(0, -1, 'up'));
    bindBtn('btn-down', () => move(0, 1, 'down'));
    bindBtn('btn-left', () => move(-1, 0, 'left'));
    bindBtn('btn-right', () => move(1, 0, 'right'));

    bindBtn('btn-a', () => {
      const key = `${player.x},${player.y}`;
      if (landmarks[key]) {
        message = `* Inspected: ${landmarks[key]} *`;
      } else {
        message = "Nothing here but cobblestone.";
      }
      draw();
    });

    bindBtn('btn-b', () => {
      message = "You took a bite of a cider donut.";
      draw();
    });

    // Keyboard support for desktop fallback
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') move(0, -1, 'up');
      if (e.key === 'ArrowDown' || e.key === 's') move(0, 1, 'down');
      if (e.key === 'ArrowLeft' || e.key === 'a') move(-1, 0, 'left');
      if (e.key === 'ArrowRight' || e.key === 'd') move(1, 0, 'right');
      if (e.key === 'z') document.getElementById('btn-a').dispatchEvent(new Event('pointerdown'));
      if (e.key === 'x') document.getElementById('btn-b').dispatchEvent(new Event('pointerdown'));
    });

    // Initial render
    draw();
  </script>
</body>
</html>
